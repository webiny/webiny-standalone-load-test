# Variant of nginx.conf that reuses upstream connections, as most production configs do: an empty
# Upgrade header now maps to an empty Connection header instead of `close`. nginx keeps idle
# upstream connections for 60 s (keepalive_timeout's default); Node closes them after 5 s
# (keepAliveTimeout's default). Used for the keep-alive check only (compose.keepalive.yml).
#
# Round robin over the two API processes. Copied from the standalone E2E job in webiny-js
# (.github/workflows/wac/e2e/createStandaloneJobs.ts): upgrade headers for websockets, the Host
# header passed through, no body size limit for uploads, nginx's default 60 s proxy_read_timeout.
worker_processes 1;
# Each proxied websocket holds two connections (client and upstream). 4096 capped the stack at
# about 2,000 sockets; see REPORT.md, scenario 2.
events { worker_connections 16384; }
http {
    log_format timed '$remote_addr "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time ua=$upstream_addr';
    access_log /var/log/nginx/access.log timed;
    client_max_body_size 0;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    upstream webiny_api {
        server api-1:3000;
        server api-2:3000;
        keepalive 64;
    }
    server {
        listen 3002;
        location / {
            proxy_pass http://webiny_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
