# SQLite baseline: one API process on a SQLite file, behind nginx, k6 and the Node client as in
# compose.yml. Stop the Postgres stack first (same ports):
#   docker compose down && docker compose -f compose.sqlite.yml up -d
# WEBINY_BUILD_SQLITE names the SQLite build under builds/.
name: webiny-standalone-load-test-sqlite

services:
    api:
        image: node:24-slim
        working_dir: /app
        command: ["node", "--import", "/monitor/monitor.mjs", "start.mjs"]
        volumes:
            - ./builds/${WEBINY_BUILD_SQLITE:?set WEBINY_BUILD_SQLITE}/api:/app:ro
            - ./monitor:/monitor:ro
            - sqlite:/data
        env_file: .env
        environment:
            PORT: "3000"
            LT_PROC_NAME: api
            WEBINY_API_URL: http://localhost:3002
            WEBINY_ADMIN_URL: http://localhost:3001
            WEBINY_LOCAL_STORAGE_PATH: /data/storage
            WEBINY_SQL_FILENAME: /data/webiny.sqlite
        stop_grace_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "1.5"
                    memory: 1g

    nginx:
        image: nginx:1.27-alpine
        volumes:
            - ./nginx/nginx-sqlite.conf:/etc/nginx/nginx.conf:ro
        ports:
            - "3002:3002"
        depends_on:
            - api
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 128m

    admin:
        image: nginx:1.27-alpine
        volumes:
            - ./builds/${WEBINY_BUILD_SQLITE:?set WEBINY_BUILD_SQLITE}/admin:/usr/share/nginx/html:ro
            - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "3001:80"

    k6:
        image: grafana/k6:latest
        profiles: ["load"]
        volumes:
            - ./k6:/scripts:ro
            - ./results:/results
        environment:
            API_URL: http://nginx:3002
            API_KEY: ${API_KEY_SQLITE:-}
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 1g

    client:
        image: node:24-slim
        profiles: ["load"]
        working_dir: /lt
        volumes:
            - ./scripts:/lt/scripts:ro
            - ./results:/results
        environment:
            API_URL: http://nginx:3002
            API_KEY: ${API_KEY_SQLITE:-}
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 1g

volumes:
    sqlite:
